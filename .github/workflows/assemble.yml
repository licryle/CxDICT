name: Assemble and release

# Two functions (spec §13):
# - push to main: rebuild each language touched under dictionaries/.
#   Tooling-only pushes run the tests but cut no release (use dispatch).
# - manual dispatch ("Run workflow" button): rebuild all known languages,
#   or a single language via the `language` input.
# Each released language owns ONE release object: tag latest-<code>
#   (e.g. latest-fr), refreshed in place every run with stably-named
#   assets CxDICT-<Name>-{Human,Full}.u8 (<Name> from dict.toml) and the
#   scope notes as body. Our own per-language `:latest`, since GitHub's
#   "Latest" badge is repo-wide. The release commit additionally carries
#   two git tags (no extra release objects): the moving latest-<code>
#   pointer and an immutable CxDICT-<Name>-YYYYMMDD daily marker.
on:
  push:
    branches: [main]
    paths:
      - "dictionaries/**"
      - "src/**"
      - "scripts/**"
      - "flake.nix"
      - ".github/workflows/assemble.yml"
  workflow_dispatch:
    inputs:
      language:
        description: "Language code to release (default all)"
        required: false
        default: "all"

permissions:
  contents: write  # create GitHub releases and upload .u8 assets

concurrency:
  group: assemble-${{ github.ref }}
  cancel-in-progress: false  # releases must never be half-published

jobs:
  test:
    name: Test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v23
      - run: nix develop --command python -m pytest -q

  changes:
    name: Detect languages to build
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      count: ${{ steps.set.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history: before..sha diff needs both ends
      - id: set
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
            && [ "${{ inputs.language }}" != "all" ]; then
            CODES="${{ inputs.language }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            for d in dictionaries/*/; do
              [ -f "$d/dict.toml" ] && CODES="$CODES $(basename "$d")"
            done
          else
            CHANGED="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")"
            CODES=""
            for p in $CHANGED; do
              case "$p" in
                dictionaries/*)
                  code="$(echo "$p" | cut -d/ -f2)"
                  if [ -f "dictionaries/$code/dict.toml" ]; then
                    CODES="$CODES $code"  # one language's own unit
                  else
                    # Shared paths (e.g. dictionaries/cc-cedict/) hit all.
                    for d in dictionaries/*/; do
                      [ -f "$d/dict.toml" ] && CODES="$CODES $(basename "$d")"
                    done
                  fi
                  ;;
              esac
            done
          fi
          MATRIX="$(echo "$CODES" | tr ' ' '\n' | sort -u | grep -v '^$' \
            | jq -R . | jq -cs '{include: map({code: .})}')"
          COUNT="$(echo "$MATRIX" | jq '.include | length')"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Releasing: $(echo "$CODES" | tr ' ' '\n' | sort -u | grep -v '^$' | tr '\n' ' ')"

  release:
    name: Build and release (${{ matrix.code }})
    runs-on: ubuntu-latest
    needs: [test, changes]
    if: needs.changes.outputs.count != '0'
    strategy:
      fail-fast: false  # languages release independently
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v23

      - name: Read language metadata
        id: meta
        run: |
          CODE="${{ matrix.code }}"
          NAME="$(python -c 'import tomllib,sys; print(tomllib.load(open(f"dictionaries/{sys.argv[1]}/dict.toml","rb"))["release_name"])' "$CODE")"
          {
            echo "relname=$NAME"
            echo "human=CxDICT-${NAME}-Human.u8"
            echo "full=CxDICT-${NAME}-Full.u8"
          } >> "$GITHUB_OUTPUT"

      # 1. Gate on inputs first: any violated data relationship fails the
      #    run before anything is produced (spec §14). Overlaps are NOT
      #    auto-fixed here — run scripts/cleanup.py locally and commit the
      #    result (see docs/workflow.md).
      - name: Validate inputs
        run: nix develop --command python scripts/validate.py --language "${{ matrix.code }}"

      # 2. Assemble both dictionaries (spec §10): CC-CEDICT scope is an
      #    input to assembly via --cc-cedict for provenance; precedence
      #    base > human > llm_generated is enforced, overlaps fail (spec §14).
      - name: Assemble dictionaries
        run: >-
          nix develop --command python scripts/assemble.py --language "${{ matrix.code }}"
          --out-human "output/${{ matrix.code }}/${{ steps.meta.outputs.human }}"
          --out-full "output/${{ matrix.code }}/${{ steps.meta.outputs.full }}"

      # 3. Validate the assembled outputs against the inputs.
      - name: Validate outputs
        run: >-
          nix develop --command python scripts/validate.py --language "${{ matrix.code }}"
          --out-human "output/${{ matrix.code }}/${{ steps.meta.outputs.human }}"
          --out-full "output/${{ matrix.code }}/${{ steps.meta.outputs.full }}"

      # 4. Scope information for the release notes (spec §12, §16).
      - name: Scope information
        run: >-
          nix develop --command python scripts/scope_info.py --language "${{ matrix.code }}"
          --out "output/${{ matrix.code }}/scope.md"

      # 5. Publish the release: the language's single release object,
      #    tagged latest-<code> (e.g. latest-fr), refreshed in place with
      #    both .u8 dictionaries as assets and the scope information as
      #    the notes body. Generated files are release outputs, never
      #    committed sources (spec §13). Stable download URLs, Docker
      #    `:latest`-style:
      #    github/<owner>/<repo>/releases/download/latest-fr/CxDICT-French-Full.u8
      #    or: gh release download latest-fr --pattern '*-Full.u8'
      #    The release commit then gets TWO git tags — the moving
      #    latest-<code> pointer and an immutable CxDICT-<Name>-YYYYMMDD
      #    daily marker — and no other release objects are created.
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CODE="${{ matrix.code }}"
          NAME="${{ steps.meta.outputs.relname }}"
          DATE="$(date -u +%Y%m%d)"
          SHA="$(git rev-parse HEAD)"
          LTAG="latest-${CODE}"
          DTAG="CxDICT-${NAME}-${DATE}"
          if gh release view "$LTAG" >/dev/null 2>&1; then
            gh release upload --clobber "$LTAG" \
              "output/${CODE}/${{ steps.meta.outputs.human }}" \
              "output/${CODE}/${{ steps.meta.outputs.full }}"
            gh release edit "$LTAG" \
              --title "CxDICT ${NAME} (latest ${DATE})" \
              --notes-file "output/${CODE}/scope.md"
          else
            gh release create "$LTAG" \
              --target "$SHA" \
              --title "CxDICT ${NAME} (latest ${DATE})" \
              --notes-file "output/${CODE}/scope.md" \
              "output/${CODE}/${{ steps.meta.outputs.human }}" \
              "output/${CODE}/${{ steps.meta.outputs.full }}"
          fi
          git tag -f "$LTAG" "$SHA"
          git push --force origin "$LTAG"
          if git ls-remote --tags origin "refs/tags/${DTAG}" | grep -q .; then
            echo "dated tag ${DTAG} already exists, keeping it"
          else
            git tag "$DTAG" "$SHA"
            git push origin "$DTAG"
          fi
