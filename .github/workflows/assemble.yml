name: Assemble and release

# Spec §13: runs when relevant source data is updated or merged.
on:
  push:
    branches: [main]
    paths:
      - "data/fr/**"
      - "data/zh-CN-HSK03/**"
      - "data/cc-cedict/**"
      - "src/**"
      - "scripts/**"
      - "flake.nix"
      - ".github/workflows/assemble.yml"
  workflow_dispatch: {}

permissions:
  contents: write  # create GitHub releases and upload .u8 assets

concurrency:
  group: assemble-${{ github.ref }}
  cancel-in-progress: false  # releases must never be half-published

jobs:
  test:
    name: Test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v23
      - run: nix develop --command python -m pytest -q

  assemble:
    name: Validate, assemble, release
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v23

      # 1. Gate on inputs first: any violated data relationship fails the
      #    run before anything is produced (spec §14). Overlaps are NOT
      #    auto-fixed here — run scripts/cleanup.py locally and commit the
      #    result (see docs/workflow.md).
      - name: Validate inputs
        run: nix develop --command python scripts/validate.py --language fr

      # 2. Assemble both dictionaries (spec §10): CC-CEDICT scope is an
      #    input to assembly via --cc-cedict for provenance; precedence
      #    base > human > llm_generated is enforced, overlaps fail (spec §14).
      - name: Assemble dictionaries
        run: nix develop --command python scripts/assemble.py --language fr

      # 3. Validate the assembled outputs against the inputs.
      - name: Validate outputs
        run: >-
          nix develop --command python scripts/validate.py --language fr
          --out-human output/fr/cfdict-next-human.u8 --out-full output/fr/cfdict-next-full.u8

      # 4. Scope information for the release notes (spec §12, §16).
      - name: Scope information
        run: nix develop --command python scripts/scope_info.py --language fr --out output/fr/scope.md

      # 5. Publish the release: both .u8 dictionaries as assets, scope
      #    information as the notes body. Generated files are release
      #    outputs, never committed sources (spec §13).
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="cfdict-$(date -u +%Y%m%d-%H%M%S)"
          gh release create "$TAG" \
            --title "CFDICT-Next $TAG" \
            --notes-file output/fr/scope.md \
            output/fr/cfdict-next-human.u8 \
            output/fr/cfdict-next-full.u8
