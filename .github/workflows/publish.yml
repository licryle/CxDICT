name: Publish library

# Packages the engine as a wheel+sdist and attaches them to a GitHub
# release — no PyPI involved. Children pip-install a pinned version with:
#   pip install https://github.com/<owner>/<repo>/releases/download/<tag>/<wheel>
# (use ${{ github.repository }}-relative URLs so this survives renames).
#
# Usage: bump `version` in pyproject.toml, commit, then
#   git tag v0.1.0 && git push origin v0.1.0
# The tag MUST equal v<pyproject version>; anything else fails fast below.
# NOTE: package/module/entry-point names are pre-rename (cfdict_next);
# rename them before any child pins a release.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write  # create the release and upload dist assets

jobs:
  test:
    name: Test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip pytest pyyaml
          python -m pip install -e .
          python -m pytest -q

  publish:
    name: Build, smoke-test, release
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check tag matches pyproject version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          test "$TAG" = "v$VERSION" || { echo "tag $TAG != v$VERSION from pyproject.toml"; exit 1; }

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Smoke-test the wheel in isolation
        run: |
          python -m venv /tmp/wheeltest
          /tmp/wheeltest/bin/pip install "dist/*.whl"
          # Exercises the packaged schema file: fails if schemas/ data
          # files ever go missing from the wheel.
          /tmp/wheeltest/bin/python - <<'EOF'
          import cfdict_next
          from cfdict_next.parser.json import validate_record
          record = {
              "traditional": "行", "simplified": "行", "pinyin": "Xing2",
              "senses": [{"source_gloss": "to walk", "definition": "marcher"}],
              "cc_cedict_version": "v", "llm_model": "m",
              "prompt_version": "v6",
              "generation_date": "2025-01-01T00:00:00+00:00",
          }
          assert validate_record("行|行|Xing2", record) == "行|行|Xing2"
          print("wheel ok:", cfdict_next.__version__)
          EOF

      - name: Publish to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          WHEEL="$(basename dist/*.whl)"
          gh release create "$TAG" \
            --title "$TAG" \
            --notes "Engine library ${TAG}. Install pinned with: pip install https://github.com/${{ github.repository }}/releases/download/${TAG}/${WHEEL}" \
            dist/*.whl dist/*.tar.gz
