[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cxdict"
version = "0.2.0"
description = "CxDICT — LLM-generate CC-CEDICT in other languages, allowing for authoritative sources to take priority."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.0",  # LLM record validation against src/cxdict/schemas/llm_entry.json
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pyyaml>=6.0",  # workflow-file tests only
]

[project.scripts]
cxdict-validate = "cxdict.cli.validate:main"
cxdict-assemble = "cxdict.cli.assemble:main"
cxdict-cleanup = "cxdict.cli.cleanup:main"
cxdict-generate = "cxdict.cli.generate:main"
cxdict-scope-info = "cxdict.cli.scope_info:main"

# Explicit file selection: the project name (cxdict) no longer matches the
# package directory (src/cxdict), so hatchling's auto-detection cannot
# apply. This also keeps data/, output/ and assets/ out of both artifacts.
[tool.hatch.build.targets.wheel]
packages = ["src/cxdict"]

[tool.hatch.build.targets.sdist]
packages = ["src/cxdict"]
include = ["pyproject.toml", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
